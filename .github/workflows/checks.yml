name: Gridrunner checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  game:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run check
      - name: Install browser verifier
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify actual desktop and phone play
        run: node scripts/check-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gridrunner-browser-proof
          path: browser-proof/
          retention-days: 7
  levels:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser verifier
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Play the authored campaign levels on phone controls
        run: node scripts/check-levels-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gridrunner-level-proof
          path: level-proof/
          retention-days: 7
